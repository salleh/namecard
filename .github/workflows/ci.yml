name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: encard
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: namecard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U encard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Dummy values so `next build` (which validates env at import) succeeds.
      # No real tenant or database is contacted during CI.
      AUTH_SECRET: ci-only-dummy-secret-0123456789abcdef0123456789abcdef
      AUTH_URL: https://namecard.example.com
      AUTH_MICROSOFT_ENTRA_APPLICATION_ID: 00000000-0000-0000-0000-000000000001
      AUTH_MICROSOFT_ENTRA_ID_SECRET: ci-only-dummy
      AUTH_MICROSOFT_ENTRA_ID_ISSUER: https://login.microsoftonline.com/00000000-0000-0000-0000-000000000002/v2.0
      ADMIN_GROUP_ID: 00000000-0000-0000-0000-000000000003
      DATABASE_URL: postgresql://encard:devpassword@localhost:5432/namecard_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:coverage

      - name: Integration tests (Postgres)
        run: |
          echo "DATABASE_URL=postgresql://encard:devpassword@localhost:5432/namecard_test" > .env.test
          npm run test:integration

      - name: Build
        run: npm run build
