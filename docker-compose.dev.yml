# DEV stack — Postgres only. The app runs on the HOST (`npm run dev`) for fast
# HMR; only stateful services live in Docker. Self-contained (no base file).
#
#   docker compose -f docker-compose.dev.yml up -d      # start Postgres
#   docker compose -f docker-compose.dev.yml down        # stop
#   docker compose -f docker-compose.dev.yml down -v     # stop + wipe data
#
# The `npm run db:*` scripts wrap these. Stack/project name is `encard-dev` so it
# never collides with the production `encard` stack on a shared host.
name: encard-dev
services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.dev
    ports:
      # Published so the host-side app (and psql/Prisma tooling) can reach it.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes compose interpolation so the container's own env is used.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
