# =============================================================================
# e-Namecard — DMZ nginx reverse proxy (BASELINE / pre-TLS)
# -----------------------------------------------------------------------------
# Host:   DMZ reverse proxy (Rocky Linux 9.7), managed by the infra team.
# Place:  /etc/nginx/conf.d/namecard.example.com.conf
# Owns:   NOT this app repo. Kept here only as a handoff reference.
#
# This is the *baseline* to add BEFORE running certbot. It serves plain HTTP on
# :80 so the Let's Encrypt HTTP-01 challenge can complete, and proxies all other
# traffic to the internal Caddy. After certbot issues the cert, add the :443
# server block (see docs/deploy/dmz-nginx.md for the post-TLS example).
#
# BEFORE RELOADING NGINX, replace the placeholders:
#   <DOCKER_HOST_IP>  → internal IP of the Rocky Linux docker host running the
#                       namecard compose stack (Caddy is published on :8090).
# =============================================================================

upstream namecard_backend {
    # Internal Caddy for the namecard app. Caddy listens on 8090 (not 80) because
    # the docker host is shared with another compose app that already uses 8080.
    server <DOCKER_HOST_IP>:8090;
    keepalive 16;
}

server {
    listen      80;
    listen      [::]:80;
    server_name namecard.example.com;

    # --- ACME HTTP-01 challenge (certbot --webroot) -------------------------
    # Keep this reachable over plain HTTP even after TLS is enabled, so renewals
    # work. Create the dir first:  mkdir -p /var/www/certbot
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/certbot;
        default_type "text/plain";
        allow        all;
    }

    # --- Proxy everything else to the internal Caddy ------------------------
    location / {
        proxy_pass         http://namecard_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # OVERWRITE (not append) any client-supplied X-Forwarded-For with the
        # real peer address. Caddy resolves the true client IP from this and the
        # app's rate limiter depends on it being unspoofable (security H-1).
        # Do NOT use $proxy_add_x_forwarded_for here — that would append.
        proxy_set_header X-Forwarded-For   $remote_addr;

        # Tell the app which scheme the *public* client used. Pre-TLS this is
        # http; once the :443 block is live it becomes https, which Auth.js needs
        # for secure cookies and correct OIDC redirect URLs.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # The OIDC callback response carries large Set-Cookie headers (Auth.js
        # session token + PKCE/state/nonce). nginx's default proxy buffers (4-8k)
        # are too small to hold that header block and it returns 502 "upstream
        # sent too big header". Raise them.
        proxy_buffer_size       16k;
        proxy_buffers           4 16k;
        proxy_busy_buffers_size 16k;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
